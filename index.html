<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof Sheet — Photo Print Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17130f;
    --panel:#141110;
    --paper:#EDE7D9;
    --ink:#211D17;
    --paper-dim:#8f8874;
    --safelight:#B8241B;
    --safelight-dim:rgba(184,36,27,.16);
    --fixer:#4C7A67;
    --line:#332c22;
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --font-body:'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--paper); font-family:var(--font-body); }
  *:focus-visible{ outline:2px solid var(--safelight); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  .stage{ display:grid; grid-template-columns:300px 1fr; min-height:100vh; }
  @media (max-width:820px){ .stage{ grid-template-columns:1fr; } .controls{ order:2; border-right:none; border-top:1px solid var(--line);} .light-table{ order:1; } }

  .controls{ background:var(--panel); padding:24px 20px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:20px; }
  .brand{ display:flex; gap:10px; align-items:center; }
  .brand-mark{ font-family:var(--font-mono); font-size:22px; color:var(--safelight); }
  .brand h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; }
  .brand p{ font-family:var(--font-mono); font-size:10px; color:var(--paper-dim); margin:2px 0 0; text-transform:uppercase; letter-spacing:.08em; }

  .load-btn{ display:flex; align-items:center; justify-content:center; gap:8px; background:var(--safelight); color:#fff; font-family:var(--font-display); font-weight:700; font-size:14px; padding:13px; border-radius:3px; cursor:pointer; transition:background .15s; }
  .load-btn:hover{ background:#9c1e17; }

  .thumbs{ display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow-y:auto; }
  .thumb{ position:relative; width:46px; height:46px; border-radius:2px; overflow:hidden; border:1px solid var(--line); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{ position:absolute; top:0; right:0; background:rgba(0,0,0,.7); color:#fff; border:none; width:16px; height:16px; font-size:11px; line-height:1; cursor:pointer; }

  .section h2{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--paper-dim); margin:0 0 10px; }

  .layout-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .layout-btn{ background:#1e1a15; border:1px solid var(--line); border-radius:3px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--paper-dim); font-family:var(--font-mono); font-size:11px; cursor:pointer; }
  .layout-btn.active{ border-color:var(--safelight); color:var(--paper); background:var(--safelight-dim); }
  .mini{ width:24px; height:18px; display:grid; gap:2px; color:var(--paper-dim); }
  .layout-btn.active .mini{ color:var(--safelight); }
  .mini .cell{ background:currentColor; opacity:.6; border-radius:1px; }
  .mini.g1{ grid-template-columns:1fr; }
  .mini.g2{ grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
  .mini.g4{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .mini.g6{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr; }
  .mini.g9{ grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr 1fr; }

  .toggle{ display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; }
  .toggle button{ flex:1; background:#1e1a15; color:var(--paper-dim); border:none; padding:9px; font-family:var(--font-body); font-size:13px; cursor:pointer; }
  .toggle button.active{ background:var(--safelight); color:#fff; }

  .summary{ font-family:var(--font-mono); font-size:12px; color:var(--paper-dim); border-top:1px solid var(--line); padding-top:14px; }
  .print-btn{ background:var(--fixer); color:#fff; font-family:var(--font-display); font-weight:700; font-size:15px; padding:14px; border:none; border-radius:3px; cursor:pointer; }
  .print-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .print-btn:hover:not(:disabled){ background:#3d6353; }
  .hint{ font-size:11px; color:var(--paper-dim); line-height:1.5; margin:0; }

  .light-table{ background:#0c0a08; padding:28px; overflow:auto; }
  .sheet-nav{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ font-family:var(--font-mono); font-size:11px; background:#1e1a15; color:var(--paper-dim); border:1px solid var(--line); padding:6px 12px; border-radius:2px; cursor:pointer; }
  .tab.active{ border-color:var(--safelight); color:var(--paper); }

  .empty-state{ color:var(--paper-dim); font-family:var(--font-mono); font-size:13px; text-align:center; padding:100px 20px; border:1px dashed var(--line); border-radius:4px; }
  .light-table.drag-over .empty-state{ border-color:var(--safelight); color:var(--paper); }

  .sheet{ display:none; background:var(--paper); aspect-ratio:8.5/11; width:100%; max-width:600px; margin:0 auto 20px; padding:14px; gap:8px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .sheet.active{ display:grid; }

  .frame{ position:relative; background:#000; overflow:hidden; border-radius:1px; }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  body.bw-mode .frame img{ filter:grayscale(100%); }
  .frame-no{ position:absolute; top:3px; left:3px; font-family:var(--font-mono); font-size:9px; color:#fff; background:rgba(0,0,0,.5); padding:1px 4px; border-radius:2px; z-index:2; }
  .frame .remove{ position:absolute; top:3px; right:3px; background:rgba(0,0,0,.55); color:#fff; border:none; width:16px; height:16px; font-size:11px; cursor:pointer; z-index:2; border-radius:2px; }

  @media print{
    body{ background:#fff !important; }
    .controls, .sheet-nav, .frame .remove, .empty-state{ display:none !important; }
    .light-table{ background:#fff !important; padding:0; }
    .stage{ display:block; }
    .sheet{ display:grid !important; box-shadow:none; margin:0; max-width:none; width:100%; height:100vh; page-break-after:always; }
    .sheet:last-child{ page-break-after:auto; }
    .frame-no{ background:transparent; color:#000; }
  }
</style>
</head>
<body>
<div class="stage">
  <aside class="controls">
    <div class="brand">
      <span class="brand-mark">◧</span>
      <div>
        <h1>Proof Sheet</h1>
        <p>Print layouts, no cm required</p>
      </div>
    </div>

    <label class="load-btn">
      Load photos
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </label>

    <div class="thumbs" id="thumbs"></div>

    <div class="section">
      <h2>Photos per sheet</h2>
      <div class="layout-grid" id="layoutPicker">
        <button class="layout-btn" data-count="1"><span class="mini g1"><span class="cell"></span></span>1</button>
        <button class="layout-btn" data-count="2"><span class="mini g2"><span class="cell"></span><span class="cell"></span></span>2</button>
        <button class="layout-btn active" data-count="4"><span class="mini g4"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></span>4</button>
        <button class="layout-btn" data-count="6"><span class="mini g6"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></span>6</button>
        <button class="layout-btn" data-count="9"><span class="mini g9"><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span></span>9</button>
      </div>
    </div>

    <div class="section">
      <h2>Color</h2>
      <div class="toggle" id="colorToggle">
        <button data-mode="color" class="active">Color</button>
        <button data-mode="bw">B&amp;W</button>
      </div>
    </div>

    <div class="summary" id="summary">0 photos • 0 sheets</div>
    <button class="print-btn" id="printBtn" disabled>Print</button>
    <p class="hint">If B&amp;W doesn't come through on paper, also set your printer's own properties to grayscale / black ink only — that's the guaranteed fallback.</p>
  </aside>

  <main class="light-table" id="lightTable">
    <div class="sheet-nav" id="sheetNav"></div>
    <div class="sheets" id="sheets">
      <div class="empty-state">Load photos, or drag them in here from your desktop</div>
    </div>
  </main>
</div>

<script>
  const LAYOUTS = {
    1:{cols:1, rows:1}, 2:{cols:1, rows:2}, 4:{cols:2, rows:2}, 6:{cols:2, rows:3}, 9:{cols:3, rows:3}
  };
  const state = { photos: [], layout: 4, bw: false, currentSheet: 0 };

  const fileInput = document.getElementById('fileInput');
  const thumbsEl = document.getElementById('thumbs');
  const sheetsEl = document.getElementById('sheets');
  const navEl = document.getElementById('sheetNav');
  const summaryEl = document.getElementById('summary');
  const printBtn = document.getElementById('printBtn');
  const lightTable = document.getElementById('lightTable');

  function handleFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        state.photos.push({ id: Math.random().toString(36).slice(2), url: e.target.result });
        renderAll();
      };
      reader.readAsDataURL(file);
    });
  }

  function removePhoto(id){
    state.photos = state.photos.filter(p => p.id !== id);
    const total = Math.max(1, Math.ceil(state.photos.length / state.layout));
    if(state.currentSheet > total - 1) state.currentSheet = total - 1;
    renderAll();
  }

  function goToSheet(i){ state.currentSheet = i; renderAll(); }

  function chunk(arr, size){
    const out = [];
    for(let i=0; i<arr.length; i += size) out.push(arr.slice(i, i+size));
    return out;
  }

  function renderThumbs(){
    thumbsEl.innerHTML = state.photos.map(p => `
      <div class="thumb"><img src="${p.url}" alt=""><button onclick="removePhoto('${p.id}')" title="Remove">×</button></div>
    `).join('');
  }

  function renderSheets(){
    if(state.photos.length === 0){
      sheetsEl.innerHTML = '<div class="empty-state">Load photos, or drag them in here from your desktop</div>';
      return;
    }
    const pages = chunk(state.photos, state.layout);
    const cfg = LAYOUTS[state.layout];
    sheetsEl.innerHTML = pages.map((page, i) => `
      <div class="sheet ${i === state.currentSheet ? 'active' : ''}" style="grid-template-columns:repeat(${cfg.cols},1fr); grid-template-rows:repeat(${cfg.rows},1fr);">
        ${page.map((p, idx) => `
          <div class="frame">
            <span class="frame-no">${String(i*state.layout + idx + 1).padStart(2,'0')}</span>
            <img src="${p.url}" alt="">
            <button class="remove" onclick="removePhoto('${p.id}')" title="Remove">×</button>
          </div>
        `).join('')}
      </div>
    `).join('');
  }

  function renderNav(){
    const total = Math.ceil(state.photos.length / state.layout) || 0;
    if(total <= 1){ navEl.innerHTML = ''; return; }
    navEl.innerHTML = Array.from({length: total}, (_, i) =>
      `<button class="tab ${i === state.currentSheet ? 'active' : ''}" onclick="goToSheet(${i})">Sheet ${i+1}</button>`
    ).join('');
  }

  function renderSummary(){
    const total = Math.ceil(state.photos.length / state.layout) || 0;
    summaryEl.textContent = `${state.photos.length} photo${state.photos.length !== 1 ? 's' : ''} • ${total} sheet${total !== 1 ? 's' : ''}`;
    printBtn.disabled = state.photos.length === 0;
  }

  function renderAll(){ renderThumbs(); renderSheets(); renderNav(); renderSummary(); }

  fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value=''; });

  document.querySelectorAll('.layout-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.layout = parseInt(btn.dataset.count, 10);
      state.currentSheet = 0;
      renderAll();
    });
  });

  document.querySelectorAll('#colorToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#colorToggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.bw = btn.dataset.mode === 'bw';
      document.body.classList.toggle('bw-mode', state.bw);
    });
  });

  printBtn.addEventListener('click', () => window.print());

  ['dragenter','dragover'].forEach(evt => document.body.addEventListener(evt, e => { e.preventDefault(); lightTable.classList.add('drag-over'); }));
  ['dragleave','drop'].forEach(evt => document.body.addEventListener(evt, e => { e.preventDefault(); lightTable.classList.remove('drag-over'); }));
  document.body.addEventListener('drop', e => { if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
</script>
</body>
</html>
